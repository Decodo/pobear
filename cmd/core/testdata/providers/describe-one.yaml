args: providers decodo
stdout: |
    decodo — https://data.decodo.com/v1/scrape

      universal (default)
        render   bool                              default: false
        geo      string   pattern: ^[a-z]{2}$

      amazon_product
        domain   enum: com, co.uk, de              default: com
stderr: ""
exit: 0
providers:
    decodo.yaml: |
        name: decodo
        endpoint: https://data.decodo.com/v1/scrape
        auth: {type: bearer, credential: token}
        templates:
          - name: universal
            default: true
            options:
              - {name: render, type: bool, default: false}
              - {name: geo, type: string, pattern: '^[a-z]{2}$'}
            request: {body: {source: universal, url: "{{ .URL }}"}}
          - name: amazon_product
            options:
              - {name: domain, type: enum, values: [com, co.uk, de], default: com}
            request: {body: {query: "{{ .URL }}"}}
        response: {body: "$.html"}
