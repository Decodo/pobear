# EXAMPLE PROVIDER
name: decodo
endpoint: https://scraper-api.decodo.com/v2/scrape
auth: { type: basic, credential: token }
templates:
  - name: universal
    default: true
    options:
      - { name: headless, type: enum, values: [html, png], default: html }
      - { name: proxy_pool, type: enum, values: [standard, premium], default: premium }
      - { name: geo, type: string }
      - { name: locale, type: string }
      - { name: device_type, type: string }
    request:
      body:
        target: universal
        url: "{{ .URL }}"
        headless: "{{ .Options.headless }}"
        proxy_pool: "{{ .Options.proxy_pool }}"
        geo: "{{ .Options.geo }}"
        locale: "{{ .Options.locale }}"
        device_type: "{{ .Options.device_type }}"
  - name: google
    options:
      - { name: headless, type: enum, values: [html, png], default: html }
      - { name: page_count, type: int, default: 1, min: 1, max: 10 }
      - { name: locale, type: string }
      - { name: device_type, type: string }
      - { name: parse, type: bool, default: false }
    request:
      body:
        target: google
        url: "{{ .URL }}"
        headless: "{{ .Options.headless }}"
        page_count: "{{ .Options.page_count }}"
        locale: "{{ .Options.locale }}"
        device_type: "{{ .Options.device_type }}"
        parse: "{{ .Options.parse }}"
  - name: bing
    options:
      - { name: headless, type: enum, values: [html, png], default: html }
      - { name: geo, type: string }
      - { name: locale, type: string }
    request:
      body:
        target: bing
        url: "{{ .URL }}"
        headless: "{{ .Options.headless }}"
        geo: "{{ .Options.geo }}"
        locale: "{{ .Options.locale }}"
  - name: amazon
    options:
      - { name: headless, type: enum, values: [html, png], default: html }
      - { name: geo, type: string }
      - { name: parse, type: bool, default: false }
    request:
      body:
        target: amazon
        url: "{{ .URL }}"
        headless: "{{ .Options.headless }}"
        geo: "{{ .Options.geo }}"
        parse: "{{ .Options.parse }}"
errors:
  - { status: 401, kind: auth }
  - { status: 429, kind: rateLimit }
response:
  status: "$..status_code"
  body: "$..content"
