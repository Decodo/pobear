# EXAMPLE PROVIDER
name: decodo
endpoint: https://scraper-api.decodo.com/v2/scrape
auth: { type: bearer, credential: token }
templates:
  - name: universal
    default: true
    options:
      - { name: render, type: bool, default: false }
      - { name: geo, type: string, pattern: '^[a-z]{2}$' }
    request:
      body:
        source: universal
        url: "{{ .URL }}"
        render: "{{ .Options.render }}"
        geo: "{{ .Options.geo }}"
  - name: amazon_product
    options:
      - { name: domain, type: enum, values: [com, co.uk, de], default: com }
    request:
      body:
        source: amazon_product
        query: "{{ .URL }}"
        domain: "{{ .Options.domain }}"
response:
  body: "$.results[0].content"
