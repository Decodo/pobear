input: |
  version: 1
  source: {crawl: {seeds: [https://a.test], maxPages: 100}}
  fetch: {use: local}
wantErr: false
wantSpec:
  version: 1
  source:
    crawl:
      seeds: [https://a.test]
      depth: 0
      maxPages: 100
      maxDuration: ""
      scope: same-host
      include: []
      exclude: []
      sitemap: false
      robots: respect
  fetch:
    use: local
    profile: chrome
    timeout: 30s
    noRedirects: false
    headers: {}
  limits:
    concurrency: 8
    rps: 0
    retries: 3
    backoff: exponential
    pluginConcurrency: 0
    pluginTimeout: 30s
  stages: []
  sink:
    use: stdout
