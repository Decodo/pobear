input: |
  version: 1
  source: {urls: [https://a.test]}
  fetch: {use: local, headers: {X-Str: "1", X-Empty: ""}}
wantErr: false
wantSpec:
  version: 1
  source:
    urls: [https://a.test]
  fetch:
    use: local
    profile: chrome
    ladder: false
    timeout: 30s
    noRedirects: false
    headers:
      X-Str: "1"
      X-Empty: ""
  limits:
    concurrency: 8
    rps: 0
    retries: 3
    backoff: exponential
    pluginConcurrency: 0
    pluginTimeout: 30s
  stages: []
  sink:
    use: stdout
