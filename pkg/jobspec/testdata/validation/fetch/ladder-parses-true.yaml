input: |
  version: 1
  source: {urls: [https://a.test]}
  fetch: {use: local, ladder: true, name: acme}
wantErr: false
wantSpec:
  version: 1
  source:
    urls: [https://a.test]
  fetch:
    use: local
    name: acme
    profile: chrome
    ladder: true
    timeout: 30s
    noRedirects: false
    headers: {}
  limits:
    concurrency: 8
    rps: 0
    retries: 3
    backoff: exponential
    pluginConcurrency: 0
    pluginTimeout: 30s
  stages: []
  sink:
    use: stdout
