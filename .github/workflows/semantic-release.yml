name: semantic-release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      notes: ${{ steps.semantic.outputs.new_release_notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - run: go test ./...

      # Only tags. The GitHub Release is created by goreleaser in the release
      # job, so it never exists without its binaries attached.
      - id: semantic
        uses: cycjimmy/semantic-release-action@v8.1.3
        with:
          semantic_version: 25
          # Major 9 matches semantic-release 25's bundled conventional-changelog-writer 8.
          extra_plugins: conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: version
    if: needs.version.outputs.published == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      notes: ${{ needs.version.outputs.notes }}
