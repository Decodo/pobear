name: canary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  canary:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.canary.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute and push canary tag
        id: canary
        run: |
          git fetch --tags --force
          latest_stable=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$latest_stable" ]; then
            base="0.0.0"
          else
            base="${latest_stable#v}"
          fi
          IFS=. read -r major minor patch <<< "$base"
          tag="v${major}.${minor}.$((patch + 1))-canary.${{ github.run_number }}"

          echo "latest stable tag: ${latest_stable:-<none>}"
          echo "new canary tag:    $tag"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: canary
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.canary.outputs.tag }}
