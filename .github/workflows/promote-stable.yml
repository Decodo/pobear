name: promote-stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, bare semver, no "v" prefix or suffix (e.g. "0.1.1")'
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate and push the stable tag
        run: |
          version="${{ inputs.version }}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be bare semver (e.g. \"0.1.1\"), got: $version"
            exit 1
          fi

          tag="v$version"
          git fetch --tags --force
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists"
            exit 1
          fi

          echo "Tagging $(git rev-parse HEAD) as $tag"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

  release:
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
