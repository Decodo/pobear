version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - bodyclose
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
    staticcheck:
      checks:
        - all
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pobear/pobear

run:
  timeout: 5m
